echo "AWS_PROFILE={{env.AWS_PROFILE_FOR_TST}} agentcore invoke --target tst --runtime AuditMcp --mcp-method tools/call --mcp-name list_sessions --payload '$PAYLOAD' ${SESSION_ID:+--session-id $SESSION_ID}"
