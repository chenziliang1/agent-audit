# See claude code environment variables documents at https://code.claude.com/docs/en/settings
[env]
# Make uv use the mise Python below (first ``python`` on PATH), not a uv-managed one
# or a global ``~/.config/uv/.python-version`` pin. ``[tools] python`` is the one dev version.
UV_PYTHON = "python"
# Local, per-person settings; copy .env.example to .env (git-ignored) and fill in:
# - ENV_NAME: the current environment (dev, tst, prd) of one.config / one.bsm; default dev.
# - AWS_PROFILE_FOR_DEV, AWS_PROFILE_FOR_TST, AWS_PROFILE_FOR_PRD: the AWS CLI profile of
#   each environment; one.bsm uses it locally, the generated cdk-* tasks pass it as
#   --profile, the generated AgentCore tasks as AWS_PROFILE.
_.file = ".env"

[tools]
python = "3.12" # the dev Python, and the Python of the AgentCore runtimes
uv = "latest"
claude = "latest"
node = "24" # Next.js, and the runtime of the cdk CLI and of aws-cdk-lib (jsii)
pnpm = "latest"
awscli = "2.34.24"
"npm:aws-cdk" = "2.1145.0" # the cdk CLI; must be new enough for the aws-cdk-lib in uv.lock
"npm:@aws/agentcore" = "1.0.1" # the AgentCore CLI; deploys the agentcore/ project (Runtimes)

# === Tasks ===
# Python Environment Management
[tasks.venv-create]
description = "🐍 Create Python virtual environment using uv (creates .venv directory)"
run = "uv venv --allow-existing"

[tasks.venv-remove]
description = "🗑️ Remove Python virtual environment (deletes .venv directory)"
run = "rm -r .venv"

# Dependency Management
#
# ``inst`` is the Python half only, on purpose: every generated task below depends on
# it, and none of them needs node_modules. ``inst-all`` is what a fresh checkout runs.
[tasks.inst]
description = "💾 Install all Python dependencies using uv (syncs from pyproject.toml and uv.lock)"
depends = ["venv-create"]
run = "uv sync --all-extras --all-groups"

[tasks.inst-node-deps]
description = "📦 Install Node.js dependencies via pnpm"
run = "pnpm install"

[tasks.inst-all]
description = "💾 Install everything a fresh checkout needs (Python + Node.js)"
depends = ["inst", "inst-node-deps"]

# Testing
[tasks.test-python]
description = "🧪 Run Python unit tests using pytest"
run = ".venv/bin/pytest tests"
depends = ["inst"]

[tasks.test-node]
description = "🧪 Run Node.js tests"
run = "node --test tests_node/*.test.js"

[tasks.test]
description = "🧪 Run all unit tests (Python + Node.js)"
depends = ["test-python", "test-node"]

[tasks.cov]
description = "🧪📊 Run Python unit tests with code coverage using pytest (generates HTML report in htmlcov/; fails below 100%)"
run = ".venv/bin/pytest tests -s --tb=native --cov=agent_app --cov-report term-missing --cov-report html:htmlcov --cov-fail-under=100"
depends = ["inst"]

[tasks.int-test]
description = "🧪☁️ Run integration tests against the stacks deployed in ENV_NAME (default dev), e.g. ENV_NAME=prd mise run int-test"
run = ".venv/bin/pytest tests_int -s --tb=native"
depends = ["inst"]

[tasks.view-cov]
description = "👀📊 Open code coverage HTML report in browser (requires 'cov' task to run first)"
run = "open htmlcov/index.html"

# Code Quality
[tasks.format]
description = "🎨 Format all Python code with ruff (package, tests, CDK app, mise task scripts)"
run = "uvx ruff format agent_app tests tests_int cdk .mise/tasks"

[tasks.lint]
description = "🔍 Lint Python code with ruff (unused/undefined names)"
run = "uvx ruff check --select F401,F821,F841 agent_app tests tests_int cdk .mise/tasks"

# AgentCore, local (no AWS). The per-runtime tasks ac-local-<slug>, ac-dev-<slug>, and
# ac-local-<slug>-call are generated (gen-env-tasks), with each runtime's local port.
[tasks.free-port]
description = "🧹 Stop this repo's leftover server on a port: mise run free-port --port <port> (never stops a process outside this repo)"
run = ".venv/bin/python .mise/tasks/free-port.py"

# The audit dataset is generated outside this repository; this copies its inputs in.
[tasks.sync-audit-data]
description = "📥 Copy the audit dataset's inputs (never its labels) into agent_app/audit/data/: mise run sync-audit-data [--source <dir>], default ../datafaker/out"
run = ".venv/bin/python .mise/tasks/sync-audit-data.py"
depends = ["inst"]

# Evaluation: the agent audits a dataset's sessions, then the dataset's own evaluate.py scores it.
[tasks.eval-run]
description = "💸 Audit a dataset's sessions with the local agent, one conversation each (calls the model: every session is paid for): mise run eval-run --source <dataset dir> --name <run> --max-cost <usd> [--sample N] [--drop-intent]"
run = ".venv/bin/python .mise/tasks/eval-run.py"
depends = ["inst"]

[tasks.eval-score]
description = "📊 Score a run of eval-run with the dataset's evaluate.py (reads the labels; no model call): mise run eval-score --name <run>"
run = ".venv/bin/python .mise/tasks/eval-score.py"
depends = ["inst"]

# AgentCore CLI project (agentcore/); every task deploys or builds ALL runtimes of the project
[tasks.ac-gen]
description = "🏗️ Generate agentcore/agentcore.json, agentcore/aws-targets.json (for ENV_NAME, default dev), and agentcore_app/<Runtime>/ from the config, uv.lock, and the package"
run = ".venv/bin/python .mise/tasks/ac-gen.py"
depends = ["inst"]

[tasks.ac-check-wheels]
description = "🏗️ Check every runtime's dependencies install as agentcore deploy installs them: wheels only, Linux aarch64 (dry run, no AWS call)"
run = ".venv/bin/python .mise/tasks/ac-check-wheels.py"
depends = ["ac-gen"]

[tasks.ac-build]
description = "🏗️ Build every runtime's CodeZip and synth the AgentCore stack of each target (no AWS calls)"
run = "agentcore build"
depends = ["ac-gen"]

# Frontend
#
# The only thing that reads `data/site.toml` through the frontend's own loader,
# so it is the only thing that catches a missing required key or an `icon` that
# `lib/icons.ts` does not export. It also type-checks the TypeScript and
# statically renders both routes.
[tasks.build-web]
description = "🏗️ Build the Next.js frontend (also the only check for site.toml keys and icon names)"
run = "pnpm exec next build"

# Every dev server is stamped with this env var so `mise run kill` can find
# exactly our processes and nothing else. The name is generic on purpose; what
# identifies a checkout is the *value*, which is this checkout's path.
# kill-dev-servers.py reads the same name -- change it in both places or in
# neither.
[tasks.next-dev]
description = "🌐 Start Next.js development server"
env = { AGENT_APP_DEV_SERVER = "{{config_root}}" }
# Pinned to 3000 on purpose: failing to start beats silently hopping to 3001.
run = "next dev --port 3000"

[tasks.dev]
description = "🚀 Start the web development server (Next.js; the agent runs with ac-local-* tasks)"
depends = ["kill"]
env = { AGENT_APP_DEV_SERVER = "{{config_root}}" }
run = "pnpm exec next dev --port 3000"

[tasks.kill]
description = "🛑 Kill this project's web development server"
run = "uv run -- python kill-dev-servers.py"

# Per-environment tasks (config, AgentCore deploy, CDK)
[tasks.gen-env-tasks]
description = "🧩 Regenerate every per-environment task (config-*, ac-*, cdk-*) and per-runtime task (ac-local-*, ac-dev-*) below from EnvNameEnum, StackCtxEnum, and the runtime registry (rewrites the <env-tasks> block)"
run = ".venv/bin/python .mise/tasks/gen-env-tasks.py"
depends = ["inst"]

[tasks.gen-quick-links]
description = "🔗 Regenerate QUICK_LINKS.md, the console of every AWS resource in every environment: stacks and config from config/, runtimes, their roles and logs looked up in AWS (read only) with each environment's profile"
run = ".venv/bin/python .mise/tasks/gen-quick-links.py"
depends = ["inst"]

[tasks.print-cdk-stack-urls]
description = "🔗 Print the CloudFormation console URL of every stack in every environment (no AWS call; a failing environment prints an error, the rest still print)"
run = ".venv/bin/python .mise/tasks/print-cdk-stack-urls.py"
depends = ["inst"]

# <env-tasks>
# Generated by `mise run gen-env-tasks`. Do not edit by hand.

[tasks."config-deploy-dev"]
description = "⚙️ Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> config-deploy-dev: Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)'
.venv/bin/python .mise/tasks/config-deploy.py
"""

[tasks."config-delete-dev"]
description = "🗑️ Delete the config of dev from SSM Parameter Store (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> config-delete-dev: Delete the config of dev from SSM Parameter Store (writes to AWS)'
.venv/bin/python .mise/tasks/confirm.py --action 'Delete the config parameter of dev?' --skip_var CONFIRM_YES --skip_var CONFIRMED_BY_CHAIN
.venv/bin/python .mise/tasks/config-delete.py
"""

[tasks."ac-deploy-dev"]
description = "🚀 Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-deploy-dev: Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)'
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AgentAudit-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-check-deps.py
.venv/bin/python .mise/tasks/ac-gen.py
.venv/bin/python .mise/tasks/ac-check-wheels.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev
echo 'Commit agentcore/.cli/deployed-state.json if it changed: everyone who deploys shares it'
"""

[tasks."ac-down-dev"]
description = "🔴 Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-down-dev: Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)'
.venv/bin/python .mise/tasks/confirm.py --action 'Destroy every AgentCore runtime of dev?' --skip_var CONFIRM_YES --skip_var CONFIRMED_BY_CHAIN
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AgentAudit-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-gen-teardown.py
trap '.venv/bin/python .mise/tasks/ac-gen.py' EXIT
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev --yes'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore deploy --target dev --yes
echo 'Commit agentcore/.cli/deployed-state.json if it changed: everyone who deploys shares it'
"""

[tasks."ac-status-dev"]
description = "🔎 Show the deployed AgentCore runtimes of the dev target (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-status-dev: Show the deployed AgentCore runtimes of the dev target (reads AWS)'
echo '--- CloudFormation console ---'
echo 'AgentCore stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=AgentCore-AgentAudit-dev&filteringStatus=active&viewNested=true'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore status --target dev'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore status --target dev
"""

[tasks."ac-invoke-dev-audit-mcp"]
description = "🤖 Invoke the deployed AuditMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-invoke-dev-audit-mcp: Invoke the deployed AuditMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
PAYLOAD='{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "list_sessions", "arguments": {"limit": 3}}}'
echo '--- Run command ---'
echo "AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime AuditMcp --mcp-method tools/call --mcp-name list_sessions --payload '$PAYLOAD' ${SESSION_ID:+--session-id $SESSION_ID}"
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime AuditMcp --mcp-method tools/call --mcp-name list_sessions --payload "$PAYLOAD" ${SESSION_ID:+--session-id $SESSION_ID}
"""

[tasks."ac-invoke-dev-audit-agent"]
description = "🤖 Invoke the deployed AuditAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-invoke-dev-audit-agent: Invoke the deployed AuditAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
PAYLOAD='{"prompt": "Audit session ses_e70a629f1a7e. Is anything in it a security risk?"}'
echo '--- Run command ---'
echo "AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime AuditAgent --payload '$PAYLOAD' ${SESSION_ID:+--session-id $SESSION_ID}"
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore invoke --target dev --runtime AuditAgent --payload "$PAYLOAD" ${SESSION_ID:+--session-id $SESSION_ID}
"""

[tasks."ac-logs-dev-audit-mcp"]
description = "📜 Show the recent logs of the deployed AuditMcp of dev; SINCE=2h looks further back (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-logs-dev-audit-mcp: Show the recent logs of the deployed AuditMcp of dev; SINCE=2h looks further back (reads AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name AuditMcp --target dev --since ${SINCE:-30m}'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name AuditMcp --target dev --since ${SINCE:-30m}
"""

[tasks."ac-logs-dev-audit-agent"]
description = "📜 Show the recent logs of the deployed AuditAgent of dev; SINCE=2h looks further back (reads AWS)"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> ac-logs-dev-audit-agent: Show the recent logs of the deployed AuditAgent of dev; SINCE=2h looks further back (reads AWS)'
.venv/bin/python .mise/tasks/ac-gen.py
echo '--- Run command ---'
echo 'AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name AuditAgent --target dev --since ${SINCE:-30m}'
AWS_PROFILE={{env.AWS_PROFILE_FOR_DEV}} agentcore logs runtime --name AuditAgent --target dev --since ${SINCE:-30m}
"""

[tasks."ac-chain-up-dev"]
description = "🚀 Deploy everything AgentCore of dev: config-deploy-dev → cdk-up-dev-agentcore-deps-stack → ac-deploy-dev"
run = [
    "echo '=== ac-chain-up-dev: Deploy everything AgentCore of dev, in this order ==='",
    "echo '  1. config-deploy-dev: Deploy the config of dev to SSM Parameter Store, if it changed (writes to AWS)'",
    "echo '  2. cdk-up-dev-agentcore-deps-stack: Deploy stack agentcore-deps of dev (no approval prompt)'",
    "echo '  3. ac-deploy-dev: Deploy every AgentCore runtime to the dev target: check that the agentcore-deps policy and the config exist, generate the project for dev, check the wheels, deploy (writes to AWS)'",
    { task = "config-deploy-dev" },
    { task = "cdk-up-dev-agentcore-deps-stack" },
    { task = "ac-deploy-dev" },
    "echo '=== ac-chain-up-dev: done ==='",
]

[tasks."ac-chain-down-dev"]
description = "🔴 Destroy everything AgentCore of dev: ac-down-dev → cdk-down-dev-agentcore-deps-stack → config-delete-dev"
env = { CONFIRMED_BY_CHAIN = "true" }
run = [
    "echo '=== ac-chain-down-dev: Destroy everything AgentCore of dev, in this order ==='",
    "echo '  1. ac-down-dev: Destroy every AgentCore runtime of the dev target: deploy an empty project with --yes, then generate the real one again, even if the deploy fails (writes to AWS; keeps the agentcore-deps stack and the config)'",
    "echo '  2. cdk-down-dev-agentcore-deps-stack: Destroy stack agentcore-deps of dev (force, no confirmation)'",
    "echo '  3. config-delete-dev: Delete the config of dev from SSM Parameter Store (writes to AWS)'",
    ".venv/bin/python .mise/tasks/confirm.py --action 'Destroy the AgentCore runtimes, the agentcore-deps stack, and the config of dev?' --skip_var CONFIRM_YES",
    { task = "ac-down-dev" },
    { task = "cdk-down-dev-agentcore-deps-stack" },
    { task = "config-delete-dev" },
    "echo '=== ac-chain-down-dev: done ==='",
]

[tasks."ac-test-dev"]
description = "🧪 Test the deployed AgentCore runtimes of dev: ac-status-dev → ac-invoke-dev-audit-mcp → ac-invoke-dev-audit-agent"
run = [
    "echo '=== ac-test-dev: Test the deployed AgentCore runtimes of dev, in this order ==='",
    "echo '  1. ac-status-dev: Show the deployed AgentCore runtimes of the dev target (reads AWS)'",
    "echo '  2. ac-invoke-dev-audit-mcp: Invoke the deployed AuditMcp of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'",
    "echo '  3. ac-invoke-dev-audit-agent: Invoke the deployed AuditAgent of dev with its sample payload; SESSION_ID=<id> continues a session (calls AWS)'",
    { task = "ac-status-dev" },
    { task = "ac-invoke-dev-audit-mcp" },
    { task = "ac-invoke-dev-audit-agent" },
    "echo '=== ac-test-dev: done ==='",
]

[tasks."cdk-synth-dev-all"]
description = "⚪ Synthesize all stacks of dev to CloudFormation templates (no AWS call)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-synth-dev-all: Synthesize all stacks of dev to CloudFormation templates (no AWS call)'
echo '--- CloudFormation console ---'
echo 'agent-audit-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-web-invoker: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-web-invoker&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-monitoring: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-monitoring&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth'
cdk synth
"""

[tasks."cdk-plan-dev-all"]
description = "🔵 Plan all stacks of dev: diff against what is deployed, through a CloudFormation change set (no deploy)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-plan-dev-all: Plan all stacks of dev: diff against what is deployed, through a CloudFormation change set (no deploy)'
echo '--- CloudFormation console ---'
echo 'agent-audit-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-web-invoker: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-web-invoker&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-monitoring: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-monitoring&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk diff --all --method auto --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-up-dev-all"]
description = "🟢 Deploy all stacks of dev (no approval prompt)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-up-dev-all: Deploy all stacks of dev (no approval prompt)'
echo '--- CloudFormation console ---'
echo 'agent-audit-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-web-invoker: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-web-invoker&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-monitoring: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-monitoring&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk deploy --all --require-approval never --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-down-dev-all"]
description = "🔴 Destroy all stacks of dev (force, no confirmation)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-down-dev-all: Destroy all stacks of dev (force, no confirmation)'
echo '--- CloudFormation console ---'
echo 'agent-audit-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-web-invoker: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-web-invoker&filteringStatus=active&viewNested=true'
echo 'agent-audit-dev-monitoring: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-monitoring&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk destroy --all --force --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk destroy --all --force --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

[tasks."cdk-synth-dev-agentcore-deps-stack"]
description = "⚪ Synthesize stack agentcore-deps of dev to CloudFormation templates (no AWS call)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst"]
run = """
echo '>>> cdk-synth-dev-agentcore-deps-stack: Synthesize stack agentcore-deps of dev to CloudFormation templates (no AWS call)'
echo '--- CloudFormation console ---'
echo 'agent-audit-dev-agentcore-deps: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=agent-audit-dev-agentcore-deps&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth agent-audit-dev-agentcore-deps --exclusively'
cdk synth agent-audit-dev-agentcore-deps --exclusively
"""

[tasks."cdk-plan-dev-agentcore-deps-stack"]
description = "🔵 Plan stack agentcore-deps of dev: diff against what is deployed, through a CloudFormation change set (no deploy)"
